<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras - FoodPlaner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
        }
        
        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        
        h1 {
            margin-bottom: 20px;
        }
        
        .add-item {
            display: flex;
            margin-bottom: 20px;
        }
        
        .add-item input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px 0 0 4px;
        }
        
        .add-item select {
            padding: 10px;
            border: 1px solid #ddd;
            border-left: none;
        }
        
        .add-item button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }
        
        .items-list {
            list-style-type: none;
        }
        
        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .item span {
            flex: 1;
        }
        
        .item .category {
            background-color: #f0f0f0;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.8em;
            margin-right: 10px;
        }
        
        .item .actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
            margin-left: 5px;
        }
        
        .delete-btn {
            color: #e74c3c;
        }
        
        .check-btn {
            color: #2ecc71;
        }
        
        .item.checked {
            text-decoration: line-through;
            opacity: 0.6;
        }
        
        .filters {
            display: flex;
            margin-bottom: 20px;
        }
        
        .filters button {
            padding: 8px 15px;
            margin-right: 10px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .filters button.active {
            background-color: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        
        .clear-all {
            padding: 8px 15px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        footer {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
        }
        
        .nav-buttons {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #333;
        }
        
        .nav-btn i {
            font-size: 1.5em;
            margin-bottom: 5px;
        }
        
        .nav-btn.active {
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <header>
        <h1>Lista de Compras</h1>
    </header>
    
    <div class="container">
        <div class="filters">
            <button id="all-filter" class="active">Todos</button>
            <button id="pending-filter">Pendientes</button>
            <button id="completed-filter">Completados</button>
        </div>
        
        <div class="add-item">
            <input type="text" id="new-item" placeholder="Añadir producto...">
            <select id="category">
                <option value="frutas">Frutas</option>
                <option value="verduras">Verduras</option>
                <option value="carnes">Carnes</option>
                <option value="lacteos">Lácteos</option>
                <option value="cereales">Cereales</option>
                <option value="congelados">Congelados</option>
                <option value="limpieza">Limpieza</option>
                <option value="otros">Otros</option>
            </select>
            <button id="add-btn">Añadir</button>
        </div>
        
        <ul class="items-list" id="shopping-list">
            <!-- Lista de items se generará dinámicamente -->
        </ul>
        
        <button class="clear-all" id="clear-all">Limpiar Lista</button>
    </div>
    
    <div class="nav-buttons">
        <a href="INICIOindex.html" class="nav-btn">
            <i class="fas fa-home"></i>
            <span>Inicio</span>
        </a>
        <a href="RECETAindex.html" class="nav-btn">
            <i class="fas fa-book"></i>
            <span>Recetas</span>
        </a>
        <a href="CALENDARIOindex.html" class="nav-btn">
            <i class="fas fa-calendar"></i>
            <span>Calendario</span>
        </a>
        <a href="LISTACOMPRASindex.html" class="nav-btn active">
            <i class="fas fa-shopping-cart"></i>
            <span>Compras</span>
        </a>
        <a href="favoritosindex.html" class="nav-btn">
            <i class="fas fa-heart"></i>
            <span>Favoritos</span>
        </a>
    </div>
    
    <script src="LISTACOMPRAS.js"></script>
</body>
</html>
