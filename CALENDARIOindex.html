<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodPlaner - Calendario de Comidas</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        
        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 1rem;
        }
        
        nav {
            background-color: #333;
            overflow: hidden;
        }
        
        nav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        
        nav a:hover {
            background-color: #ddd;
            color: black;
        }
        
        .calendar-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: the 20px;
        }
        
        .month-selector {
            display: flex;
            align-items: center;
        }
        
        .month-selector button {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px 10px;
        }
        
        #current-month {
            font-size: 1.5rem;
            margin: 0 15px;
        }
        
        .calendar {
            width: 100%;
            border-collapse: collapse;
        }
        
        .calendar th {
            background-color: #f2f2f2;
            padding: 10px;
            text-align: center;
        }
        
        .calendar td {
            border: 1px solid #ddd;
            padding: 10px;
            height: 100px;
            vertical-align: top;
        }
        
        .calendar .day-number {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .meal-item {
            background-color: #e3f2fd;
            padding: 5px;
            margin: 2px 0;
            border-radius: 3px;
            font-size: 0.9rem;
        }
        
        .add-meal {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 5px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 5px;
        }
        
        /* Modal para añadir comidas */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }
        
        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border-radius: 5px;
            width: 50%;
            box-shadow: 0 5px 8px rgba(0,0,0,0.2);
        }
        
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .close:hover {
            color: black;
        }
        
        form {
            display: flex;
            flex-direction: column;
        }
        
        form input, form select, form textarea {
            margin-bottom: 15px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        form button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .other-month {
            background-color: #f9f9f9;
            color: #999;
        }
        
        .today {
            background-color: #e3f2fd;
        }
        
        @media screen and (max-width: 768px) {
            .calendar td {
                height: 60px;
                padding: 5px;
            }
            
            .meal-item {
                font-size: 0.7rem;
            }
            
            .modal-content {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>FoodPlaner-Calendario</h1>
        <p>Tu planificador de comidas semanal</p>
    </header>
    
    <nav>
        <a href="INICIOindex.html">Inicio</a>
        <a href="CALENDARIOindex.html" class="active">Calendario</a>
        <a href="RECETAindex.html">Catálogo de Recetas</a>
        <a href="LISTACOMPRASindex.html">Lista de Compras</a>
        <a href="favoritosindex.html">Favoritos</a>
    </nav>
    
    <div class="calendar-container">
        <div class="calendar-header">
            <div class="month-selector">
                <button id="prev-month">&lt;</button>
                <h2 id="current-month">Mayo 2025</h2>
                <button id="next-month">&gt;</button>
            </div>
            <div>
                <button id="view-shopping-list">Ver lista de compras</button>
            </div>
        </div>
        
        <table class="calendar" id="calendar-table">
            <thead>
                <tr>
                    <th>Domingo</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                    <th>Sábado</th>
                </tr>
            </thead>
            <tbody id="calendar-body">
            
            </tbody>
        </table>
    </div>
    
    
    <div id="meal-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Añadir comida</h2>
            <form id="add-meal-form">
                <input type="hidden" id="meal-date" name="date">
                
                <label for="meal-type">Tipo de comida:</label>
                <select id="meal-type" name="mealType" required>
                    <option value="desayuno">Desayuno</option>
                    <option value="almuerzo">Almuerzo</option>
                    <option value="cena">Cena</option>
                    <option value="merienda">Merienda</option>
                </select>
                
                <label for="meal-name">Nombre de la comida:</label>
                <input type="text" id="meal-name" name="mealName" required>
                
                <label for="meal-ingredients">Ingredientes:</label>
                <textarea id="meal-ingredients" name="ingredients" rows="4" placeholder="Ingrediente 1, Ingrediente 2, ..."></textarea>
                
                <label for="meal-notes">Notas adicionales:</label>
                <textarea id="meal-notes" name="notes" rows="2"></textarea>
                
                <button type="submit">Guardar</button>
            </form>
        </div>
    </div>
    
    <!-- Vincular el archivo JavaScript -->
    <script src="CALENDARIO.js"></script>
</body>
</html>
