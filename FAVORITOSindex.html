<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos - FoodPlaner</title>
    
    <!-- Enlaces a CSS -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Estilos específicos para la página de favoritos */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background-color: #4CAF50;
            color: white;
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .favoritos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .favorito-card {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .favorito-card:hover {
            transform: translateY(-5px);
        }
        
        .favorito-imagen {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .favorito-info {
            padding: 15px;
        }
        
        .favorito-titulo {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .favorito-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
        }
        
        .favorito-acciones {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        
        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }
        
        .btn-secondary {
            background-color: #f1f1f1;
            color: #333;
        }
        
        .btn:hover {
            opacity: 0.9;
        }
        
        .mensaje-vacio {
            text-align: center;
            margin-top: 50px;
            color: #666;
        }
        
        /* Estilos para el navbar */
        nav {
            background-color: #333;
            overflow: hidden;
        }
        
        nav ul {
            margin: 0;
            padding: 0;
            list-style: none;
            display: flex;
            justify-content: space-around;
        }
        
        nav ul li {
            float: left;
        }
        
        nav ul li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        
        nav ul li a:hover {
            background-color: #4CAF50;
        }
        
        nav ul li a.active {
            background-color: #4CAF50;
            font-weight: bold;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .favoritos-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }
        
        @media (max-width: 480px) {
            .favoritos-grid {
                grid-template-columns: 1fr;
            }
            
            nav ul {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Mis Recetas Favoritas</h1>
    </header>
    
    <nav>
        <ul>
            <li><a href="INICIOindex.html">Inicio</a></li>
            <li><a href="RECETAindex.html">Catálogo de Recetas</a></li>
            <li><a href="CALENDARIOindex.html">Calendario</a></li>
            <li><a href="LISTACOMPRASindex.html">Lista de Compras</a></li>
            <li><a href="FAVORITOSindex.html" class="active">Favoritos</a></li>
            <li><a href="REGISTROindex.html">Registro</a></li>
        </ul>
    </nav>
    
    <div class="container">
        <div id="favoritos-container" class="favoritos-grid">
            <!-- El contenido de favoritos se cargará dinámicamente mediante JavaScript -->
        </div>
        
        <div id="mensaje-vacio" class="mensaje-vacio" style="display: none;">
            <h3>No tienes recetas favoritas guardadas</h3>
            <p>Explora el catálogo de recetas y agrega tus favoritas</p>
            <a href="CATALOSRECETAindex.html" class="btn btn-primary">
                <i class="fas fa-search"></i> Explorar recetas
            </a>
        </div>
    </div>

    <!-- Enlace a JavaScript -->
    <script src="FAVORITOS.js"></script>
</body>
</html>
